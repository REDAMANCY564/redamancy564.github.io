  <style>
    .demo-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    @media (min-width: 760px) { .demo-grid { grid-template-columns: 5fr 7fr; } }
    .demo-grid > * { min-width: 0; }   /* let cards shrink on phones instead of widening the page */
    .mol-name { font-weight: 700; margin: 0; }
    .mol-smiles { color: var(--muted); font-size: .875rem; word-break: break-all; margin: 2px 0 8px; }
    .mol-svg { aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--muted); font-size: .875rem; text-align: center; }
    .mol-svg svg { width: 100%; height: auto; }
    .chart-box { position: relative; height: 320px; }

    .search { margin-bottom: 20px; }
    .search-row { display: flex; gap: 8px; max-width: 560px; }
    .search-row input { flex: 1 1 auto; min-width: 0; max-width: none; }
    .btn { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 4px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .examples { margin-top: 8px; }
    .search-status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); }
    .search-status.error { color: var(--error); }
    .mol-links { margin: 6px 0 0; }

    .threshold { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: .875rem; }
    .threshold .thr-title { font-weight: 600; margin-bottom: 2px; }
    .threshold .thr-value { font-size: 1rem; }

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title" data-no="3">基于图神经网络的分子气味描述词预测</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="sub" data-i18n="hero.sub">输入分子，图神经网络预测它的气味描述词。</p>
    </section>

    <!-- Demo -->
    <section class="section" id="demo">
      <form id="search-form" class="search" novalidate>
        <label class="field" for="search-input" data-i18n="search.label">搜索任意分子</label>
        <div class="search-row">
          <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-attr="placeholder:search.placeholder" placeholder="输入英文名称、CAS 号或 SMILES">
          <button type="submit" id="search-btn" class="btn" data-i18n="search.button">预测</button>
        </div>
        <p class="examples small"><span class="muted" data-i18n="search.examples">示例：</span>
          <span class="ex-list"><button type="button" class="linklike" data-q="linalool">linalool</button><button type="button" class="linklike" data-q="5989-27-5">5989-27-5</button><button type="button" class="linklike mono" data-q="CCOC(=O)CC(C)C">CCOC(=O)CC(C)C</button></span></p>
        <p class="small search-status" id="search-status" aria-live="polite"></p>
      </form>

      <label class="field" for="preset" data-i18n="demo.select">或者选择一个预设分子</label>
      <select id="preset"></select>

      <div class="demo-grid">
        <div class="card">
          <p class="mol-name" id="mol-name"></p>
          <p class="mol-smiles mono" id="mol-smiles"></p>
