<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odor Predictor | Jingwei Cui</title>
  <meta name="description" content="A graph neural network that predicts odor descriptors of flavor molecules from their structure.">
  <link rel="stylesheet" href="../assets/style.css?v=20261019v">
  <style>
    .demo-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    @media (min-width: 760px) { .demo-grid { grid-template-columns: 5fr 7fr; } }
    .demo-grid > * { min-width: 0; }   /* let cards shrink on phones instead of widening the page */
    .mol-name { font-size: 1.15rem; font-weight: 700; margin: 0; }
    .mol-smiles { color: var(--muted); font-size: .875rem; word-break: break-all; margin: 2px 0 8px; }
    .mol-svg { aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--muted); font-size: .875rem; text-align: center; }
    .mol-svg svg { width: 100%; height: auto; }
    .chart-box { position: relative; height: 320px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { font-size: .85rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); }
    .chip.hit { background: var(--accent); border-color: var(--accent); color: #fff; }

    .search { margin-bottom: 20px; }
    .search-row { display: flex; gap: 8px; max-width: 560px; }
    .search-row input { flex: 1 1 auto; min-width: 0; max-width: none; }
    .btn { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 8px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .examples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
    .chip-btn { font: inherit; font-size: .85rem; padding: 2px 10px; border-radius: 999px; cursor: pointer;
                border: 1px solid var(--border); background: var(--surface); color: var(--accent); max-width: 100%;
                overflow: hidden; text-overflow: ellipsis; }
    .chip-btn:hover { border-color: var(--accent); }
    .search-status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); }
    .search-status.error { color: #b42318; }
    .mol-links { margin: 6px 0 0; }
    .mol-links a + a::before { content: " / "; color: var(--muted); }
    .threshold { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: .9rem; }
    .threshold .thr-title { font-weight: 600; margin-bottom: 2px; }
    .threshold .thr-value { font-size: 1.05rem; }

  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="../projects/" data-i18n="nav.projects" aria-current="page">项目</a>
        <a href="../cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title">Odor Predictor</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="sub" data-i18n="hero.sub"></p>
    </section>

    <!-- Demo -->
    <section class="section" id="demo">
      <form id="search-form" class="search" novalidate>
        <label class="field" for="search-input" data-i18n="search.label">Search any molecule</label>
        <div class="search-row">
          <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-attr="placeholder:search.placeholder">
          <button type="submit" id="search-btn" class="btn" data-i18n="search.button">Predict</button>
        </div>
        <div class="examples small">
          <span class="muted" data-i18n="search.examples">Examples:</span>
          <button type="button" class="chip-btn" data-q="linalool">linalool</button>
          <button type="button" class="chip-btn" data-q="5989-27-5">5989-27-5</button>
          <button type="button" class="chip-btn mono" data-q="CCOC(=O)CC(C)C">CCOC(=O)CC(C)C</button>
        </div>
        <p class="small search-status" id="search-status" aria-live="polite"></p>
      </form>

      <label class="field" for="preset" data-i18n="demo.select">Or pick a preset molecule</label>
      <select id="preset"></select>

      <div class="demo-grid">
        <div class="card">
          <p class="mol-name" id="mol-name"></p>
          <p class="mol-smiles mono" id="mol-smiles"></p>
          <div class="mol-svg" id="mol-svg"></div>
          <div class="contrib-picker" id="contrib-picker"></div>
          <div class="contrib-legend" id="contrib-legend"></div>
          <p class="small mol-links">
            <a id="mol-pubchem" target="_blank" rel="noopener" data-i18n="demo.pubchem">View on PubChem</a>
            <a id="mol-taste" data-i18n="demo.taste_link">See its predicted taste</a>
            <a id="mol-finder" data-i18n="demo.finder_link">Find substitutes</a>
          </p>
          <div class="threshold" id="mol-threshold" hidden></div>
        </div>
        <div class="card">
          <h3 data-i18n="demo.chart_title">Top 8 predicted odor descriptors</h3>
          <div class="chart-box"><canvas id="pred-chart" aria-label="Predicted odor descriptors"></canvas></div>
          <p class="small muted" data-i18n="demo.prob_note" style="margin-top:8px"></p>
        </div>
      </div>
      <div class="note" id="mol-status"></div>
      <div class="card" id="kb-card" style="margin-top:16px">
        <h3 data-i18n="kb.sources_title">Typical flavor sources</h3>
        <div id="kb-body" class="small muted"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="tool-src" data-i18n-html="footer.short"></p>
      <p data-i18n-html="footer.site"></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2026.3.6/dist/RDKit_minimal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.js"></script>
  <script src="engine.js"></script>
  <script src="../assets/i18n.js?v=20261019v" data-page-dict="i18n/"></script>
  <script src="../flavor-kb/kb.js"></script>
  <script src="../flavor-kb/kb-ui.js"></script>
  <script src="../assets/contrib.js"></script>
  <script src="app.js?v=20261019u"></script>
</body>
</html>
