  <script>
    (async function () {
      let profile = {};
      try {
        profile = await (await fetch("../assets/profile.json?v=20261019x")).json();
      } catch (e) {
        console.error("Could not load profile.json", e);
      }
      await I18N.ready;
      const esc = SITE.esc, pick = o => esc(I18N.pick(o));

      // Publications come from assets/profile.json, the same data as the homepage
      function render() {
        document.getElementById("pub-published").innerHTML = (profile.papers || []).map(p =>
          "<li>" + esc(p.title) + '<br><span class="venue"><i>' + esc(p.venue) + "</i> · " + pick(p.rank) + "</span></li>").join("");
        document.getElementById("pub-submitted").innerHTML = (profile.submitted || []).map(s => "<li>" + esc(s) + "</li>").join("");
        document.getElementById("pub-cn").innerHTML = (profile.cn_papers || []).map(p =>
          "<li>" + pick(p.title) + '<br><span class="venue"><i>' + pick(p.venue) + "</i>" + (I18N.lang === "zh" ? "，" : ", ") + pick(p.note) + "</span></li>").join("");
        const noted = list => (list || []).map(p => "<li>" + pick(p.title) + '<br><span class="venue">' + pick(p.note) + "</span></li>").join("");
        document.getElementById("pub-patents").innerHTML = noted(profile.patents);
        document.getElementById("pub-apps").innerHTML = noted(profile.patent_apps);
        document.getElementById("pub-talks").innerHTML = noted(profile.talks);
      }

      render();
      I18N.onChange(render);
    })();
  </script>
