<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>7 Odor Perception Differences | Jingwei Cui</title>
  <meta name="description" content="Using public ratings of 480 molecules by 55 people: how much of the variation comes from the molecule, personal preference and measurement noise.">
  <link rel="stylesheet" href="../assets/style.css?v=20261021a">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    .viz { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #b9b7b0;
           --pos: #2a78d6; --neg: #e34948; --grid: #ece9e2; --axis: #c9c5bc; }
    .hidden { display: none !important; }
    .viz-box { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
               padding: 12px 14px; margin: 10px 0; }
    .viz-box svg { display: block; width: 100%; height: auto; overflow: visible; }
    .viz-box svg text { font-size: 12px; fill: var(--muted); }
    .viz-box svg text.ink { fill: var(--text); }
    .viz-title { font-weight: 600; margin: 0 0 2px; }
    .viz-sub { font-size: .875rem; color: var(--muted); margin: 0 0 6px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .875rem; margin: 6px 0 0; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
    .legend i.dot { border-radius: 50%; }
    .tip { position: absolute; z-index: 5; pointer-events: none; max-width: 260px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.14); padding: 6px 10px; font-size: .875rem; line-height: 1.45; }
    .tip b { display: block; }
    .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 6px 0 4px; }
    .ctl label { font-size: .875rem; color: var(--muted); }
    .ctl select { width: auto; max-width: 100%; padding: 5px 8px; font-size: .875rem; }
    table.data th, table.data td { white-space: normal; }
    table.data td.num, table.data th.num { white-space: nowrap; }
    details { margin-top: 10px; }
    details summary { cursor: pointer; font-weight: 600; }
    .pass { color: #1f6f3f; font-weight: 600; }
    .fail { color: var(--error); font-weight: 600; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="../projects/" data-i18n="nav.projects" aria-current="page">项目</a>
        <a href="../cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container viz">
    <section class="hero">
      <h1 data-i18n="hero.title">Decomposing Individual Differences in Odor Ratings</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="small muted" id="hero-data" style="margin-top:8px"></p>
      <p class="status muted" id="load-status" data-i18n="loading" aria-live="polite"></p>
    </section>

    <section class="section" id="variance">
      <h2 data-sec="1" data-i18n="var.title">Sources of rating differences</h2>
      <div class="viz-box">
        <p class="viz-sub" data-i18n="var.sub"></p>
        <svg id="var-svg" role="img" data-i18n-attr="aria-label:var.chart"></svg>
        <div class="legend" id="var-legend"></div>
      </div>
      <p id="var-hero"></p>
      <p id="var-take"></p>
    </section>

    <section class="section" id="spread">
      <h2 data-sec="1" data-i18n="spread.title">Ratings of one molecule across people</h2>
      <div class="ctl">
        <label for="spread-select" data-i18n="spread.pick">Molecule</label>
        <select id="spread-select"></select>
      </div>
      <div class="viz-box">
        <p class="viz-title" id="spread-title"></p>
        <p class="viz-sub" id="spread-sub"></p>
        <svg id="spread-svg" role="img" data-i18n-attr="aria-label:spread.aria"></svg>
      </div>
      <p class="small" id="spread-note"></p>
    </section>

    <section class="section" id="predict">
      <h2 data-sec="1" data-i18n="pred.title">Predicting a new participant's ratings</h2>
      <p data-i18n="pred.intro"></p>
      <div class="ctl">
        <label for="demo-select" data-i18n="pred.pick">Anonymous test participant</label>
        <select id="demo-select"></select>
        <span class="seg" role="group" data-i18n-attr="aria-label:pred.toggle">
          <button type="button" id="btn-model" aria-pressed="true" data-i18n="pred.btn.model">Model</button>
          <button type="button" id="btn-panel" aria-pressed="false" data-i18n="pred.btn.panel">Panel average only</button>
        </span>
      </div>
      <p class="small" style="margin:6px 0 0" id="demo-known"></p>
      <p data-i18n="pred.conclusion" style="margin-top:12px"></p>
      <div class="viz-box">
        <p class="viz-title" id="demo-title"></p>
        <p class="viz-sub" id="demo-sub"></p>
        <svg id="demo-svg" role="img" data-i18n-attr="aria-label:pred.aria"></svg>
      </div>
      <p class="small muted" id="demo-rule"></p>
    </section>

    <section class="section" id="segments">
      <h2 data-sec="1" data-i18n="seg.title">Participant segments</h2>
      <p id="seg-verdict"></p>
      <div class="viz-box">
        <p class="viz-title" data-i18n="seg.scores.title"></p>
        <p class="viz-sub" data-i18n="seg.scores.sub"></p>
        <svg id="scores-svg" role="img" data-i18n-attr="aria-label:seg.scores.title"></svg>
      </div>
      <p data-i18n="seg.scores.note"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="tool-src" data-i18n-html="footer.short"></p>
      <p data-i18n-html="footer.site"></p>
    </div>
  </footer>

  <script src="../assets/i18n.js?v=20261021a" data-page-dict="i18n/"></script>
  <script src="../assets/projects.js?v=20261021a"></script>
  <script src="app.js?v=20261021a"></script>
</body>
</html>
