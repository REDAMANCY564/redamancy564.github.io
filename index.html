<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jingwei Cui</title>
  <meta name="description" content="Jingwei Cui: PhD candidate in Food Science and Engineering (Jiangnan University, with joint PhD training at NUS). Flavor research, papers and browser tools for flavor and perception research.">
  <link rel="stylesheet" href="assets/style.css?v=20261019y">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="./" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="./projects/" data-i18n="nav.projects">项目</a>
        <a href="./cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container home">
    <!-- Screen 1: who I am -->
    <section class="who">
      <h1 data-i18n="site.name">崔京伟</h1>
      <p class="role" id="role"></p>
      <p id="bio"></p>
      <p class="contact-row" id="contact"></p>
    </section>

    <!-- Screen 2: all projects as a table of contents -->
    <section class="home-block" id="projects">
      <h2 data-i18n="home.projects">项目</h2>
      <ol class="dir-list" id="dir-list"></ol>
    </section>

    <!-- Screen 3: papers, patents and talks -->
    <section class="home-block" id="papers">
      <h2 data-i18n="home.papers">论文</h2>
      <ol class="paper-list" id="paper-list"></ol>
      <h2 data-i18n="home.patents">专利与会议报告</h2>
      <ul class="paper-list" id="patent-list"></ul>
      <p class="more"><a href="cv/#pubs" data-i18n="home.full_list">完整列表见简历</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n-html="footer.site"></p>
    </div>
  </footer>

  <script src="assets/i18n.js?v=20261019y"></script>
  <script src="assets/projects.js?v=20261019y"></script>
  <script>
    (async function () {
      let profile = {};
      try {
        profile = await (await fetch("assets/profile.json?v=20261019y")).json();
      } catch (e) {
        console.error("Could not load profile.json", e);
      }
      await I18N.ready;
      const esc = SITE.esc;

      function render() {
        const t = I18N.t;
        document.title = t("home.page_title");
        document.getElementById("role").textContent = I18N.pick(profile.role) || "";
        document.getElementById("bio").textContent = I18N.pick(profile.bio) || "";

        // One contact line: Email / CV (PDF) / GitHub
        const links = [];
        if (profile.email) links.push('<a href="mailto:' + esc(profile.email) + '">' + esc(t("home.email")) + "</a>");
        if (profile.cv_pdf) links.push('<a href="' + esc(profile.cv_pdf) + '" target="_blank" rel="noopener">' + esc(t("home.cv_pdf")) + "</a>");
        if (profile.github) links.push('<a href="' + esc(profile.github) + '" target="_blank" rel="noopener">GitHub</a>');
        if (profile.linkedin) links.push('<a href="' + esc(profile.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>');
        document.getElementById("contact").innerHTML = links.join("");

        SITE.renderDirectory(document.getElementById("dir-list"), "");

        document.getElementById("paper-list").innerHTML = (profile.papers || []).map(p =>
          "<li>" + esc(p.title) + '<br><span class="venue"><i>' + esc(p.venue) + "</i> · " + esc(t("home.first_author")) + "</span></li>"
        ).join("");
        document.getElementById("patent-list").innerHTML = (profile.patents || []).concat(profile.talks || []).map(p =>
          "<li>" + esc(I18N.pick(p.title)) + '<br><span class="venue">' + esc(I18N.pick(p.note)) + "</span></li>"
        ).join("");
      }

      render();
      I18N.onChange(render);
    })();
  </script>
</body>
</html>
