<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- Template of the 1200x630 share image used by the homepage, projects page and CV
       (rendered by tools/make_og.py; not linked from the site). Text comes from assets/profile.json. -->
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 88px 96px; display: flex; flex-direction: column; justify-content: center; border-top: 14px solid var(--accent); }
    .mark { width: 96px; height: 96px; margin-bottom: 40px; }
    h1 { font-family: var(--font-serif); font-size: 76px; font-weight: 600; margin: 0 0 28px; color: var(--text); letter-spacing: .01em; }
    h1 span { color: var(--muted); font-weight: 500; margin-left: .35em; }
    p { margin: 0 0 12px; font-size: 32px; line-height: 1.45; color: var(--text); }
    p.en { color: var(--muted); font-size: 28px; }
    .url { margin-top: auto; font-size: 26px; color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <img class="mark" src="../favicon.svg" alt="">
    <h1 id="name"></h1>
    <p id="role-zh"></p>
    <p class="en" id="role-en"></p>
    <div class="url">redamancy564.github.io</div>
  </div>
  <script>
    fetch("../assets/profile.json").then(r => r.json()).then(p => {
      document.getElementById("name").innerHTML = p.name.zh + "<span>" + p.name.en + "</span>";
      document.getElementById("role-zh").textContent = p.role.zh;
      document.getElementById("role-en").textContent = p.role.en;
      document.body.dataset.ready = "1";
    });
  </script>
</body>
</html>
