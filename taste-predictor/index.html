<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>6 Taste Predictor | Jingwei Cui</title>
  <meta name="description" content="Predicts whether a small molecule is sweet, bitter, umami or tasteless.">
  <link rel="stylesheet" href="../assets/style.css?v=20261020a">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    .demo-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
    @media (min-width: 760px) { .demo-grid { grid-template-columns: 5fr 7fr; } }
    .demo-grid > * { min-width: 0; }
    .mol-name { font-weight: 700; margin: 0; }
    .mol-smiles { color: var(--muted); font-size: .875rem; word-break: break-all; margin: 2px 0 8px; }
    .mol-svg { aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--muted); font-size: .875rem; text-align: center; }
    .mol-svg svg { width: 100%; height: auto; }
    .chart-box { position: relative; height: 240px; }
    .raw-labels { margin-top: 8px; }
    .raw-labels summary { cursor: pointer; color: var(--accent); }
    .raw-labels ul { margin: 6px 0 0; padding-left: 1.2em; word-break: break-word; }

    .search { margin-bottom: 20px; }
    .search-row { display: flex; gap: 8px; max-width: 560px; }
    .search-row input { flex: 1 1 auto; min-width: 0; max-width: none; }
    .btn { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 4px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .examples { margin-top: 8px; }
    .search-status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); }
    .search-status.error { color: var(--error); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="../projects/" data-i18n="nav.projects" aria-current="page">项目</a>
        <a href="../cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title">Taste Prediction for Small Molecules with Graph Neural Networks</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="sub" data-i18n="hero.sub"></p>
    </section>

    <!-- Demo -->
    <section class="section" id="demo">
      <form id="search-form" class="search" novalidate>
        <label class="field" for="search-input" data-i18n="search.label">Search any molecule</label>
        <div class="search-row">
          <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-attr="placeholder:search.placeholder">
          <button type="submit" id="search-btn" class="btn" data-i18n="search.button">Predict</button>
        </div>
        <p class="examples small"><span class="muted" data-i18n="search.examples">Examples:</span>
          <span class="ex-list"><button type="button" class="linklike" data-q="aspartame">aspartame</button><button type="button" class="linklike" data-q="quinine">quinine</button><button type="button" class="linklike mono" data-q="CC(C)CC(=O)O">CC(C)CC(=O)O</button></span></p>
        <p class="small search-status" id="search-status" aria-live="polite"></p>
      </form>

      <label class="field" for="preset" data-i18n="demo.select">Or pick a preset molecule</label>
      <select id="preset"></select>

      <div class="demo-grid">
        <div class="card">
          <p class="mol-name" id="mol-name"></p>
          <p class="mol-smiles mono" id="mol-smiles"></p>
          <p class="small muted" id="mol-raw" hidden></p>
          <div class="mol-svg" id="mol-svg"></div>
          <div class="contrib-picker" id="contrib-picker"></div>
          <div class="contrib-legend" id="contrib-legend"></div>
          <div class="mol-links small">
            <a id="mol-pubchem" target="_blank" rel="noopener" data-i18n="demo.pubchem">View on PubChem</a>
            <a id="mol-odor" data-i18n="demo.odor_link">See its predicted odor</a>
          </div>
        </div>
        <div class="card">
          <h3 data-i18n="demo.chart_title">Predicted taste</h3>
          <div class="chart-box"><canvas id="pred-chart" aria-label="Predicted taste probabilities"></canvas></div>
          <p class="small muted" id="chart-note" style="margin-top:8px"></p>
          <p class="small muted" id="sour-note" hidden></p>
        </div>
      </div>
      <div class="note" id="mol-status"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="tool-src" data-i18n-html="footer.short"></p>
      <p data-i18n-html="footer.site"></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2026.3.6/dist/RDKit_minimal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.js"></script>
  <script src="../odor-predictor/engine.js?v=20261020a"></script>
  <script src="engine.js?v=20261020a"></script>
  <script src="../assets/i18n.js?v=20261020a" data-page-dict="i18n/"></script>
  <script src="../assets/projects.js?v=20261020a"></script>
  <script src="../assets/contrib.js?v=20261020a"></script>
  <script src="app.js?v=20261020a"></script>
</body>
</html>
