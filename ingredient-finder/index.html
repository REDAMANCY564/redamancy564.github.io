<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2 Flavor Ingredient Finder | Jingwei Cui</title>
  <meta name="description" content="Search flavor ingredient molecules by a target odor profile, or find molecules that smell similar to a given one, using model-predicted odor profiles.">
  <link rel="stylesheet" href="../assets/style.css?v=20261019y">
  <style>
    .tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin: 8px 0 18px; flex-wrap: wrap; }
    .tab { font: inherit; font-weight: 600; padding: 9px 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px;
           background: none; color: var(--muted); cursor: pointer; }
    .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 10px; }
    .label-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 150px; overflow-y: auto; }
    .sel-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    @media (min-width: 700px) { .sel-grid { grid-template-columns: 1fr 1fr; } }
    .sel-grid h3 { margin: 0 0 6px; font-size: 1rem; }
    .sel-item { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border-radius: 999px;
                border: 1px solid var(--accent); margin: 0 6px 6px 0; font-size: .875rem; }
    .sel-item.avoid { border-color: var(--error); }
    .sel-item select { font-size: .875rem; padding: 1px 4px; width: auto; }
    .sel-item .x { font: inherit; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 1rem; line-height: 1; }
    .filters label { display: flex; align-items: flex-start; gap: 8px; margin-top: 6px; }
    .results { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 12px; }
    @media (min-width: 700px) { .results { grid-template-columns: 1fr 1fr; } }
    .res { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: start; }
    .res .svg { width: 120px; height: 90px; display: grid; place-items: center; color: var(--muted); font-size: .875rem; text-align: center; }
    .res .svg svg { width: 120px; height: 90px; }
    .res .name { font-weight: 700; margin: 0; word-break: break-word; }
    .res .smi { font-size: .875rem; color: var(--muted); word-break: break-all; margin: 2px 0 4px; }
    .res .meta { font-size: .875rem; }
    /* Predicted descriptors as plain text; the wanted ones in bold */
    .preds { margin: 2px 0 4px; }
    .hi-text { color: var(--hi); font-weight: 600; }
    .status { color: var(--muted); min-height: 1.4em; }
    .hidden { display: none !important; }
    .btn { font: inherit; font-weight: 600; padding: 7px 16px; border-radius: 4px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .bg-box { margin-top: 12px; background: var(--accent-soft); }
    .bg-box summary { cursor: pointer; font-weight: 600; color: var(--accent); }
    .suggest { position: absolute; top: 100%; left: 0; z-index: 5; width: min(460px, 100%); background: var(--surface); border: 1px solid var(--border);
               border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
    .suggest button { display: block; width: 100%; text-align: left; font: inherit; font-size: .875rem; padding: 6px 10px; border: 0; background: none; cursor: pointer; color: var(--text); }
    .suggest button:hover, .suggest button.active { background: var(--accent-soft); }
    .suggest .smi { color: var(--muted); font-size: .875rem; margin-left: 6px; }
    .b-top { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 14px; }
    @media (min-width: 820px) { .b-top { grid-template-columns: 2fr 3fr; } }
    #b-query .qsvg svg { width: 100%; max-width: 280px; height: auto; }
    #b-scatter svg, .radar svg { width: 100%; height: auto; display: block; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
    .res.hi { border-color: var(--hi); box-shadow: inset 4px 0 0 var(--hi); }
    .radar { grid-column: 1 / -1; max-width: 420px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="../projects/" data-i18n="nav.projects" aria-current="page">项目</a>
        <a href="../cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title">Flavor Ingredient Finder</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="sub" data-i18n="hero.sub"></p>
    </section>

    <section class="section" id="finder">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-a" aria-controls="panel-a" aria-selected="true" data-i18n="tab.a">Find by flavor brief</button>
        <button class="tab" role="tab" id="tab-b" aria-controls="panel-b" aria-selected="false" data-i18n="tab.b">Find substitutes</button>
      </div>
      <p class="status" id="load-status" data-i18n="loading" aria-live="polite">Loading...</p>

      <!-- Mode A -->
      <div id="panel-a" role="tabpanel" aria-labelledby="tab-a" class="hidden">
        <p class="small ex-list" id="presets-a" style="margin-top:10px"><span class="muted" data-i18n="a.presets">Examples:</span> </p>

        <div class="card" style="margin-top:14px">
          <label class="field" for="label-filter" data-i18n="a.pick_label">Add odor descriptors</label>
          <div class="row-wrap" style="margin-top:4px">
            <input type="text" id="label-filter" autocomplete="off" spellcheck="false" style="max-width:280px" data-i18n-attr="placeholder:a.pick_ph">
            <span class="small muted" data-i18n="a.add_to">Add to:</span>
            <span class="seg" role="group">
              <button type="button" id="add-want" aria-pressed="true" data-i18n="a.add_want">wanted</button>
              <button type="button" id="add-avoid" aria-pressed="false" data-i18n="a.add_avoid">unwanted</button>
            </span>
          </div>
          <div class="label-list" id="label-list"></div>

          <div class="sel-grid">
            <div><h3 data-i18n="a.want">Wanted descriptors</h3><div id="want-list"></div></div>
            <div><h3 data-i18n="a.avoid">Unwanted descriptors</h3><div id="avoid-list"></div></div>
          </div>
          <div class="row-wrap"><button type="button" class="chip-btn" id="clear-sel" data-i18n="a.clear">Clear</button></div>
          <p class="small muted" style="margin-top:10px"><span data-i18n="a.score_short"></span> <a class="help" href="about.html#method" aria-label="?">?</a></p>
          <div class="filters small">
            <label><input type="checkbox" id="f-natural"> <span data-i18n="f.natural">Only natural</span></label>
            <label id="f-unseen-label"><input type="checkbox" id="f-unseen"> <span data-i18n="f.unseen">Only not used in training</span></label>
          </div>
        </div>

        <p id="a-summary" style="margin-top:14px"></p>
        <div class="results" id="a-results"></div>
        <div class="row-wrap"><button type="button" class="chip-btn hidden" id="a-more" data-i18n="a.more">Show more</button></div>
      </div>

      <!-- Mode B -->
      <div id="panel-b" role="tabpanel" aria-labelledby="tab-b" class="hidden">
        <p data-i18n="b.intro_short"></p>
        <p class="small ex-list" id="presets-b" style="margin-top:10px"><span class="muted" data-i18n="b.presets">Examples:</span> </p>
        <details class="card bg-box hidden" id="b-bg"><summary data-i18n="b.bg_summary">Why look for a substitute?</summary><p id="b-bg-text" style="margin:8px 0 6px"></p><p class="small muted" id="b-bg-src" style="margin:0"></p></details>

        <form id="b-form" class="card" style="margin-top:14px" novalidate autocomplete="off">
          <label class="field" for="b-input" data-i18n="b.search_label">Pick a molecule</label>
          <div class="row-wrap" style="margin-top:4px;position:relative">
            <input type="text" id="b-input" spellcheck="false" autocapitalize="off" style="flex:1 1 260px;max-width:460px" data-i18n-attr="placeholder:b.search_ph"
                   role="combobox" aria-autocomplete="list" aria-controls="b-suggest" aria-expanded="false">
            <button type="submit" class="btn" id="b-go" data-i18n="b.go">Find substitutes</button>
            <div class="suggest hidden" id="b-suggest" role="listbox"></div>
          </div>
          <p class="small status" id="b-status" aria-live="polite"></p>
        </form>

        <div class="hidden" id="b-out">
          <div class="b-top">
            <div class="card" id="b-query"></div>
            <div class="card">
              <h3 style="margin-top:0" data-i18n="b.scatter_title">Odor similarity vs structure similarity</h3>
              <div id="b-scatter"></div>
              <div class="legend small" id="b-legend"></div>
            </div>
          </div>
          <p class="small muted" id="b-rule" style="margin-top:10px"></p>
          <p id="b-hi-summary"></p>
          <h3 data-i18n="b.list_title">The 20 molecules most similar in odor</h3>
          <div class="results" id="b-results"></div>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="tool-src" data-i18n-html="footer.short"></p>
      <p data-i18n-html="footer.site"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2026.3.6/dist/RDKit_minimal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.wasm.min.js"></script>
  <script src="../odor-predictor/engine.js?v=20261019y"></script>
  <script src="../assets/i18n.js?v=20261019y" data-page-dict="i18n/"></script>
  <script src="../assets/projects.js?v=20261019y"></script>
  <script src="finder.js?v=20261019y"></script>
  <script src="app.js?v=20261019y"></script>
</body>
</html>
