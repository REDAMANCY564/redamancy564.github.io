  <style>
    .hidden { display: none !important; }
    .status { color: var(--muted); min-height: 1.4em; }
    .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 6px 0 10px; }
    .ctl .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .ctl .lbl { font-size: .875rem; color: var(--muted); }
    .ctl select { width: auto; max-width: 100%; padding: 4px 8px; font-size: .875rem; }

    /* Projector-style layout: title and side panel on the left, map filling the rest of the window.
       Phones (one column): title, then the map, then the controls. */
    .map-layout { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; gap: 0 16px;
                  grid-template-areas: "head map" "panel map"; height: calc(100vh - 57px); padding: 12px 16px; }
    .map-head { grid-area: head; min-width: 0; }
    .map-layout .panel { grid-area: panel; overflow-y: auto; padding-right: 4px; min-width: 0; }
    .map-layout .map-wrap { grid-area: map; }
    .map-head h1 { font-size: 1.375rem; margin: 4px 0 0; }
    .map-head .proj-tabs { margin-bottom: var(--sp-3); }
    .panel .sub { color: var(--muted); margin-bottom: var(--sp-3); }
    .panel .tool-src { font-size: .875rem; color: var(--muted); margin-top: var(--sp-4); }
    .map-wrap { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
                overflow: hidden; height: 100%; min-height: 300px; }
    #detail { position: absolute; top: 12px; right: 52px; width: 320px; max-height: calc(100% - 24px); overflow: auto; z-index: 4; }
    @media (max-width: 899px) {
      .map-layout { grid-template-columns: 1fr; grid-template-rows: none; grid-template-areas: "head" "map" "panel"; gap: 12px; height: auto; }
      .map-head .proj-tabs { margin-bottom: 0; }
      .map-layout .map-wrap { height: 56vh; }
      #detail { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 62%; }
    }
    /* touch: one finger scrolls the page, two fingers move and zoom the map (app.js) */
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-x pan-y; }
    #map:active { cursor: grabbing; }
    .map-name { position: absolute; left: 10px; top: 8px; font-size: .875rem; font-weight: 700; color: var(--muted);
                background: rgba(255, 255, 255, .85); padding: 1px 8px; border-radius: 4px; pointer-events: none; }
    .map-btns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .map-btns button { font: inherit; width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--border);
                       background: rgba(255, 255, 255, .92); color: var(--text); cursor: pointer; font-size: 1.05rem; line-height: 1; }
    .map-btns button:hover { border-color: var(--accent); color: var(--accent); }
    .touch-hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5; max-width: calc(100% - 24px);
                  background: rgba(31, 35, 40, .86); color: #fff; font-size: .875rem; line-height: 1.4; padding: 6px 12px; border-radius: 4px;
                  text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s; }
    .touch-hint.show { opacity: 1; }
    .tip { position: absolute; z-index: 3; pointer-events: none; max-width: 260px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 4px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); padding: 6px 10px; font-size: .875rem; line-height: 1.45; }
    .tip b { display: block; word-break: break-word; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; }
    .legend button { font: inherit; font-size: .875rem; display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px;
                     border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .legend button:hover { border-color: var(--accent); }
    .legend button.on { border-color: var(--text); font-weight: 700; }
    .legend button.off { opacity: .45; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    /* phones and touch screens: 44 px map buttons, 36 px legend and descriptor chips 8 px apart */
    @media (max-width: 599px), (pointer: coarse) {
      .map-btns button { width: 44px; height: 44px; }
      .legend { gap: 8px; } .legend button { min-height: 36px; } .ctl .grp { gap: 8px; }
    }
    @media (max-width: 599px) {
      .ctl .grp:has(> .seg) { flex: 1 1 100%; }
    }
    .heat-legend { margin-top: 10px; max-width: 360px; font-size: .875rem; }
    .heat-bar { height: 10px; border-radius: 5px; border: 1px solid var(--border); }
    .heat-scale { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
    .find { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 4px 0 12px; }
    .find label.field { font-size: .875rem; margin-bottom: 4px; }
    .find .box { position: relative; }
    .find input[type="text"], .find select { max-width: none; padding: 6px 9px; font-size: .875rem; }
    .food-row { display: flex; gap: 6px; align-items: center; }
    .food-row select { flex: 1 1 0; min-width: 0; }
    .food-row i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
    .suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 6; background: var(--surface); border: 1px solid var(--border);
               border-radius: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
    .suggest button { display: block; width: 100%; text-align: left; font: inherit; font-size: .875rem; padding: 6px 10px; border: 0; background: none; cursor: pointer; color: var(--text); }
    .suggest button:hover, .suggest button.active { background: var(--accent-soft); }
    .suggest .smi { color: var(--muted); font-size: .875rem; margin-left: 6px; word-break: break-all; }
    .food-note { margin-top: 10px; }
    .food-note .ex-list { display: block; margin-top: 4px; }
    .food-note .linklike.key { font-weight: 700; }
    .det { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .det .svg { width: 100%; max-width: 200px; min-height: 100px; display: grid; place-items: center; color: var(--muted); font-size: .875rem; }
    .det .svg svg { width: 100%; height: auto; }
    .det h3 { margin: 0 0 2px; word-break: break-word; }
    .det .smi { font-size: .875rem; color: var(--muted); word-break: break-all; margin: 0 0 8px; }
    .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: .875rem; margin: 6px 0 10px; }
    .bars .bar { height: 9px; border-radius: 5px; background: var(--accent); }
    .bars .v { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .det .links { font-size: .875rem; margin-top: 10px; }
    .det .links > * + *::before { content: " / "; color: var(--muted); display: inline-block; white-space: pre; }
    .det .links span { color: var(--muted); }
    .det-card .close { float: right; font: inherit; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1.3rem; line-height: 1; }

  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>

        <a href="../cv/" data-i18n="nav.cv">简历</a>

          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container-wide map-layout">
    <div class="map-head">
      <h1 data-i18n="hero.title" data-no="5">风味分子的气味空间与结构空间对比图谱</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
    </div>
    <aside class="panel">
      <p class="sub" id="hero-sub"></p>
      <div class="ctl">
        <div class="grp">
          <span class="seg" role="group" data-i18n-attr="aria-label:ctl.map" aria-label="选择地图">
            <button type="button" id="btn-odor" aria-pressed="true" data-i18n="ctl.odor">气味地图</button>
            <button type="button" id="btn-structure" aria-pressed="false" data-i18n="ctl.structure">结构地图</button>
          </span>
        </div>
        <div class="grp">
          <label class="lbl" for="colour-by" data-i18n="ctl.colour">着色</label>
          <select id="colour-by"></select>
        </div>
        <div class="grp">
          <label class="lbl"><input type="checkbox" id="show-regions" checked> <span data-i18n="ctl.regions">显示区域标签</span></label>
        </div>
      </div>
      <div class="ctl" style="margin-top:0">
        <div class="grp" id="quick-heat"><span class="lbl" data-i18n="ctl.quick">乳品与烘焙相关描述词：</span></div>
      </div>
      <div class="find">
        <div>
          <label class="field" for="search" data-i18n="find.search">查找分子</label>
          <div class="box">
            <input type="text" id="search" autocomplete="off" spellcheck="false" autocapitalize="off" data-i18n-attr="placeholder:find.search_ph"
                   role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false" placeholder="输入分子名称（英文）或 SMILES，如 vanillin">
            <div class="suggest hidden" id="suggest" role="listbox"></div>
          </div>
        </div>
        <div>
          <label class="field" for="food-a" data-i18n="find.food">高亮食品中的物质（可选两种对比）</label>
          <div class="food-row"><i id="food-a-dot"></i><select id="food-a"></select></div>
          <div class="food-row" style="margin-top:6px"><i id="food-b-dot"></i><select id="food-b" data-i18n-attr="aria-label:find.food_b" aria-label="第二种食品（对比）"></select></div>
        </div>
      </div>
      <p class="status" id="load-status" data-i18n="loading" aria-live="polite">正在加载地图数据……</p>
      <div class="legend" id="legend"></div>
      <div class="heat-legend hidden" id="heat-legend">
        <div class="contrib-title" id="heat-title"></div>
        <div class="heat-bar" id="heat-bar"></div>
        <div class="heat-scale" id="heat-scale"></div>
        <p class="muted" id="heat-note" style="margin:4px 0 0"></p>
      </div>
      <div class="food-note small hidden" id="food-note"></div>
      <p class="tool-src" data-i18n-html="footer.short">位置和颜色来自模型预测，不是实测。气味模型为 CC BY-NC，仅供非商业学术演示。详见<a href="about.html">方法与来源</a>。</p>
    </aside>

    <div class="map-wrap" id="map-wrap">
      <canvas id="map" role="img" data-i18n-attr="aria-label:map.aria" aria-label="分子气味空间散点图"></canvas>
      <span class="map-name" id="map-name"></span>
      <div class="map-btns">
        <button type="button" id="zoom-in" data-i18n-attr="aria-label:ctl.zoom_in;title:ctl.zoom_in" aria-label="放大" title="放大">+</button>
        <button type="button" id="zoom-out" data-i18n-attr="aria-label:ctl.zoom_out;title:ctl.zoom_out" aria-label="缩小" title="缩小">−</button>
        <button type="button" id="zoom-reset" data-i18n-attr="aria-label:ctl.reset;title:ctl.reset" aria-label="复位" title="复位">⟲</button>
        <button type="button" id="map-help" data-i18n-attr="aria-label:map.hint;title:map.hint" aria-label="滚轮或双指缩放，拖动平移；点击分子查看详情，点击图例只突出该类。" title="滚轮或双指缩放，拖动平移；点击分子查看详情，点击图例只突出该类。">?</button>
      </div>
      <div class="tip hidden" id="tip"></div>
      <div class="touch-hint" id="touch-hint" data-i18n="map.touch_hint" aria-hidden="true">单指滑动滚动页面，双指移动或缩放地图</div>
      <div id="detail"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n-html="footer.site">© 2026 崔京伟 · <a href="https://github.com/REDAMANCY564/redamancy564.github.io" target="_blank" rel="noopener">代码（GitHub）</a></p>
