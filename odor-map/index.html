<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odor Space Map | Jingwei Cui</title>
  <meta name="description" content="A zoomable map of about 5,000 flavor molecules arranged by AI-predicted odor, compared with a map arranged by molecular structure.">
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .hidden { display: none !important; }
    .status { color: var(--muted); min-height: 1.4em; }
    .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 6px 0 10px; }
    .ctl .grp { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .ctl .lbl { font-size: .85rem; color: var(--muted); }
    .seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 8px; overflow: hidden; }
    .seg button { font: inherit; font-size: .9rem; padding: 4px 14px; border: 0; background: var(--surface); color: var(--accent); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
    .ctl select { width: auto; max-width: 100%; padding: 4px 8px; font-size: .9rem; }
    .chip-btn { font: inherit; font-size: .85rem; padding: 2px 10px; border-radius: 999px; cursor: pointer;
                border: 1px solid var(--border); background: var(--surface); color: var(--accent); }
    .chip-btn:hover, .chip-btn.on { border-color: var(--accent); }
    .chip-btn.on { background: var(--accent); color: #fff; }
    .map-wrap { position: relative; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface);
                box-shadow: var(--shadow); overflow: hidden; height: min(82vw, 620px); min-height: 300px; }
    @media (max-width: 699px) { .map-wrap { height: min(100vw, 64vh); } }
    #map { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #map:active { cursor: grabbing; }
    .map-name { position: absolute; left: 10px; top: 8px; font-size: .85rem; font-weight: 700; color: var(--muted);
                background: rgba(255, 255, 255, .85); padding: 1px 8px; border-radius: 6px; pointer-events: none; }
    .map-btns { position: absolute; right: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .map-btns button { font: inherit; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
                       background: rgba(255, 255, 255, .92); color: var(--text); cursor: pointer; font-size: 1.05rem; line-height: 1; }
    .map-btns button:hover { border-color: var(--accent); color: var(--accent); }
    .tip { position: absolute; z-index: 3; pointer-events: none; max-width: 260px; background: var(--surface); border: 1px solid var(--border);
           border-radius: 8px; box-shadow: 0 4px 14px rgba(0, 0, 0, .14); padding: 6px 10px; font-size: .85rem; line-height: 1.45; }
    .tip b { display: block; word-break: break-word; }
    .tip .muted { font-size: .78rem; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 10px; }
    .legend button { font: inherit; font-size: .82rem; display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px;
                     border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .legend button:hover { border-color: var(--accent); }
    .legend button.on { border-color: var(--text); font-weight: 700; }
    .legend button.off { opacity: .45; }
    .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .heat-legend { margin-top: 10px; max-width: 360px; font-size: .82rem; }
    .heat-bar { height: 10px; border-radius: 5px; border: 1px solid var(--border); }
    .heat-scale { display: flex; justify-content: space-between; color: var(--muted); font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .badge.unseen { color: #5f3dc4; border-color: #b197fc; background: #f3f0ff; }
    details.supp { margin-top: 14px; }
    details.supp summary { cursor: pointer; font-weight: 600; }
    td.num, th.num { text-align: right; }
    .find { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 4px 0 12px; }
    @media (min-width: 760px) { .find { grid-template-columns: 1fr 1fr; } }
    .find label.field { font-size: .85rem; margin-bottom: 4px; }
    .find .box { position: relative; }
    .find input[type="text"], .find select { max-width: none; padding: 6px 9px; font-size: .9rem; }
    .food-row { display: flex; gap: 6px; align-items: center; }
    .food-row select { flex: 1 1 0; min-width: 0; }
    .food-row i { flex: none; width: 12px; height: 12px; border-radius: 50%; }
    .suggest { position: absolute; top: 100%; left: 0; right: 0; z-index: 6; background: var(--surface); border: 1px solid var(--border);
               border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 280px; overflow-y: auto; }
    .suggest button { display: block; width: 100%; text-align: left; font: inherit; font-size: .9rem; padding: 6px 10px; border: 0; background: none; cursor: pointer; color: var(--text); }
    .suggest button:hover, .suggest button.active { background: var(--accent-soft); }
    .suggest .smi { color: var(--muted); font-size: .78rem; margin-left: 6px; word-break: break-all; }
    .food-note { margin-top: 10px; }
    .food-note .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .food-note .chips button { font: inherit; font-size: .8rem; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text); }
    .food-note .chips button:hover { border-color: var(--accent); }
    .food-note .chips button.key { font-weight: 700; }
    #detail { margin-top: 14px; }
    .det { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 700px) { .det { grid-template-columns: 260px 1fr; } }
    .det .svg { width: 100%; max-width: 260px; min-height: 120px; display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
    .det .svg svg { width: 100%; height: auto; }
    .det h3 { margin: 0 0 2px; word-break: break-word; }
    .det .smi { font-size: .8rem; color: var(--muted); word-break: break-all; margin: 0 0 8px; }
    .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; font-size: .85rem; margin: 6px 0 10px; }
    .bars .bar { height: 9px; border-radius: 5px; background: var(--accent); }
    .bars .v { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .det .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .det .links a, .det .links span { font-size: .875rem; font-weight: 600; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--accent); text-decoration: none; }
    .det .links span { border-color: var(--border); color: var(--muted); font-weight: 400; }
    .det-card .close { float: right; font: inherit; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 1.3rem; line-height: 1; }
    #params-table th, #params-table td, #res-table th, #res-table td { white-space: normal; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../">← <span data-i18n="nav.home">Home</span></a>
      <button class="lang-toggle" id="lang-toggle" type="button">
        <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title">Odor space map</h1>
      <p id="hero-intro"></p>
      <p class="small muted" data-i18n="wf.intro" style="margin-bottom:6px"></p>
      <div class="workflow">
        <a class="wf-step" href="../odor-predictor/"><span class="wf-no">1</span><b data-i18n="wf.1.title"></b><span data-i18n="wf.1.desc"></span></a>
        <span class="wf-arrow" aria-hidden="true">→</span>
        <a class="wf-step current" href="../odor-map/"><span class="wf-no">2</span><b data-i18n="wf.2.title"></b><span data-i18n="wf.2.desc"></span></a>
        <span class="wf-arrow" aria-hidden="true">→</span>
        <a class="wf-step" href="../ingredient-finder/"><span class="wf-no">3</span><b data-i18n="wf.3.title"></b><span data-i18n="wf.3.desc"></span></a>
        <span class="wf-arrow" aria-hidden="true">→</span>
        <a class="wf-step" href="../flavor-improver/"><span class="wf-no">4</span><b data-i18n="wf.4.title"></b><span data-i18n="wf.4.desc"></span></a>
        <span class="wf-arrow" aria-hidden="true">→</span>
        <a class="wf-step" href="../gcms-interpreter/"><span class="wf-no">5</span><b data-i18n="wf.5.title"></b><span data-i18n="wf.5.desc"></span></a>
      </div>
    </section>

    <section class="section" id="map-section">
      <div class="ctl">
        <div class="grp">
          <span class="seg" role="group" data-i18n-attr="aria-label:ctl.map">
            <button type="button" id="btn-odor" aria-pressed="true" data-i18n="ctl.odor">Odor map</button>
            <button type="button" id="btn-structure" aria-pressed="false" data-i18n="ctl.structure">Structure map</button>
          </span>
        </div>
        <div class="grp">
          <label class="lbl" for="colour-by" data-i18n="ctl.colour">Colour</label>
          <select id="colour-by"></select>
        </div>
        <div class="grp">
          <label class="lbl"><input type="checkbox" id="show-regions" checked> <span data-i18n="ctl.regions">Region labels</span></label>
        </div>
      </div>
      <div class="ctl" style="margin-top:0">
        <div class="grp" id="quick-heat"><span class="lbl" data-i18n="ctl.quick">Quick:</span></div>
      </div>
      <div class="find">
        <div>
          <label class="field" for="search" data-i18n="find.search">Find a molecule</label>
          <div class="box">
            <input type="text" id="search" autocomplete="off" spellcheck="false" autocapitalize="off" data-i18n-attr="placeholder:find.search_ph"
                   role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
            <div class="suggest hidden" id="suggest" role="listbox"></div>
          </div>
        </div>
        <div>
          <label class="field" for="food-a" data-i18n="find.food">Highlight a food</label>
          <div class="food-row"><i id="food-a-dot"></i><select id="food-a"></select></div>
          <div class="food-row" style="margin-top:6px"><i id="food-b-dot"></i><select id="food-b" data-i18n-attr="aria-label:find.food_b"></select></div>
        </div>
      </div>
      <p class="status" id="load-status" data-i18n="loading" aria-live="polite">Loading...</p>
      <div class="map-wrap" id="map-wrap">
        <canvas id="map" role="img" data-i18n-attr="aria-label:map.aria"></canvas>
        <span class="map-name" id="map-name"></span>
        <div class="map-btns">
          <button type="button" id="zoom-in" data-i18n-attr="aria-label:ctl.zoom_in;title:ctl.zoom_in">+</button>
          <button type="button" id="zoom-out" data-i18n-attr="aria-label:ctl.zoom_out;title:ctl.zoom_out">−</button>
          <button type="button" id="zoom-reset" data-i18n-attr="aria-label:ctl.reset;title:ctl.reset">⟲</button>
        </div>
        <div class="tip hidden" id="tip"></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="heat-legend hidden" id="heat-legend">
        <div class="contrib-title" id="heat-title"></div>
        <div class="heat-bar" id="heat-bar"></div>
        <div class="heat-scale" id="heat-scale"></div>
        <p class="muted" id="heat-note" style="margin:4px 0 0"></p>
      </div>
      <div class="food-note small hidden" id="food-note"></div>
      <div id="detail"></div>
      <p class="small muted" data-i18n="map.hint" style="margin-top:10px"></p>
      <p class="small" id="map-desc"></p>
      <p class="small" id="colour-note"></p>
      <p class="small" id="region-note"></p>
    </section>

    <section class="section" id="params">
      <h2 data-i18n="params.title">How the two maps were made</h2>
      <p data-i18n="params.text"></p>
      <div class="table-wrap"><table id="params-table"></table></div>
    </section>

    <section class="section" id="results">
      <h2 data-i18n="results.title">Does the odor map put similar-smelling molecules together?</h2>
      <p id="res-intro"></p>
      <div class="table-wrap"><table id="res-table"></table></div>
      <p id="res-take" style="margin-top:10px"></p>
      <details class="supp small">
        <summary data-i18n="supp.summary"></summary>
        <p id="supp-text" style="margin-top:8px"></p>
      </details>
    </section>

    <section class="section" id="limits">
      <h2 data-i18n="limits.title">Limitations</h2>
      <ul class="plain">
        <li data-i18n="limits.1"></li>
        <li data-i18n="limits.2"></li>
        <li data-i18n="limits.3"></li>
        <li data-i18n="limits.4"></li>
        <li data-i18n="limits.5"></li>
      </ul>
      <p class="small" id="excluded-note" style="margin-top:12px"></p>
      <details class="small">
        <summary data-i18n="excluded.summary">Molecules removed from the library</summary>
        <ul id="excluded-list" style="margin-top:6px"></ul>
      </details>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n-html="footer.data"></p>
      <p data-i18n-html="footer.ref"></p>
      <p data-i18n-html="footer.kb"></p>
      <p data-i18n-html="footer.code"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/d3-dispatch@3.0.1/dist/d3-dispatch.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-selection@3.0.0/dist/d3-selection.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-color@3.1.0/dist/d3-color.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-interpolate@3.0.1/dist/d3-interpolate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-ease@3.0.1/dist/d3-ease.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-timer@3.0.1/dist/d3-timer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-transition@3.0.1/dist/d3-transition.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-drag@3.0.0/dist/d3-drag.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-zoom@3.0.0/dist/d3-zoom.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-quadtree@3.0.1/dist/d3-quadtree.min.js"></script>
  <script src="../assets/i18n.js?v=20261018i" data-page-dict="i18n/"></script>
  <script src="app.js?v=20261018i"></script>
</body>
</html>
