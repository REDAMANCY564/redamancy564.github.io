  <style>
    /* Evidence tiers in one line; the definitions are in the tooltips and on the method page */
    .tiers { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: var(--sp-3) 0 0; font-size: .875rem; }
    .search-row { display: flex; gap: 8px; max-width: 560px; }
    .search-row input { flex: 1 1 auto; min-width: 0; max-width: none; }
    .btn { font: inherit; font-weight: 600; padding: 8px 18px; border-radius: 4px; border: 0;
           background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; }
    .btn:disabled { opacity: .6; cursor: progress; }
    .examples { margin-top: 8px; }
    .status { min-height: 1.5em; margin: 8px 0 0; color: var(--muted); font-size: .875rem; }
    .status.error { color: var(--error); }
    .results { display: grid; grid-template-columns: 1fr; gap: 16px; margin-top: 12px; }
    @media (min-width: 700px) { .results { grid-template-columns: 1fr 1fr; } }
    .results ul { list-style: none; margin: 0; padding: 0; }
    .results li { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .results li a { font-weight: 600; text-decoration: none; }
    .results li .meta { font-size: .875rem; color: var(--muted); }
    .detail { margin-top: 16px; }
    .detail h3 { font-size: 1.375rem; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .detail .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    @media (min-width: 760px) { .detail .grid.cmp { grid-template-columns: 5fr 7fr; } }
    .mol-svg { aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--muted); font-size: .875rem; text-align: center; }
    .mol-svg svg { width: 100%; height: auto; }
    .stmt { font-size: .875rem; margin: 4px 0 8px; }
    .abstract { line-height: 1.8; }
    .back { font-size: .875rem; display: inline-block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../" data-i18n="site.name">崔京伟</a>
      <nav class="site-nav" aria-label="Site">
        <a href="../projects/" data-i18n="nav.projects" aria-current="page">项目</a>
        <a href="../cv/" data-i18n="nav.cv">简历</a>
        <button class="lang-toggle" id="lang-toggle" type="button">
          <span data-lang="zh">中</span><span class="sep">/</span><span data-lang="en">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1 data-i18n="hero.title" data-no="8">食品关键风味物质知识库</h1>
      <nav class="proj-tabs" aria-label="Project">
        <a href="./" data-i18n="nav.tool" aria-current="page">工具</a>
        <a href="about.html" data-i18n="nav.about">方法与来源</a>
      </nav>
      <p class="sub" data-i18n="hero.sub">按食品或化合物查关键风味物质、检出物质和相关文献。</p>
      <p class="tiers"><span class="muted" data-i18n="legend.title">数据分级</span>
        <span class="tag t1k" data-i18n="legend.t1k" data-i18n-attr="title:legend.t1k_desc" title="来自 Dunkel et al. (2014) 综述正文：经 GC-O、定量和重组实验确认对该食品气味有贡献的物质。">关键风味物质</span>
        <span class="tag t1d" data-i18n="legend.t1d" data-i18n-attr="title:legend.t1d_desc" title="来自 FlavorDB 数据库：该物质在该食品中被检出过。检出不代表它对气味有贡献。">检出</span>
        <span class="tag t2" data-i18n="legend.t2" data-i18n-attr="title:legend.t2_desc" title="打开页面时从 Europe PMC 实时检索的相关论文，只列出文献，不做总结。">实时文献</span>
        <span class="tag t3" data-i18n="legend.t3" data-i18n-attr="title:legend.t3_desc" title="根据你输入的 DOI 获取摘要，标出其中出现的风味物质名称。仅基于文字匹配，不代表文献结论。">摘要文字匹配</span>
        <a class="help" href="about.html#tiers" aria-label="?">?</a></p>
    </section>

    <section class="section" id="search">
      <h2 data-sec="1" data-i18n="search.title" data-no="8.1">食品与物质检索</h2>
      <form id="search-form" novalidate>
        <label class="field" for="search-input" data-i18n="search.label">输入食品或物质名称（英文）</label>
        <div class="search-row">
          <input id="search-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-attr="placeholder:search.placeholder" placeholder="例如 butter、strawberry、vanillin、methional">
          <button type="submit" class="btn" data-i18n="search.button">查询</button>
        </div>
        <p class="examples small"><span class="muted" data-i18n="search.examples">示例：</span>
          <span class="ex-list"><button type="button" class="linklike" data-q="cultured butter">cultured butter</button><button type="button" class="linklike" data-q="strawberry">strawberry</button><button type="button" class="linklike" data-q="diacetyl">diacetyl</button><button type="button" class="linklike" data-q="methional">methional</button></span></p>
      </form>
      <p class="status" id="search-status" aria-live="polite"></p>
      <div id="results"></div>
      <div class="detail" id="detail"></div>
    </section>

    <section class="section" id="doi">
      <h2 data-sec="1" data-i18n="doi.title" data-no="8.2">DOI 摘要分析</h2>
      <form id="doi-form" novalidate>
        <label class="field" for="doi-input" data-i18n="doi.label">输入论文 DOI</label>
        <div class="search-row">
          <input id="doi-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 data-i18n-attr="placeholder:doi.placeholder" placeholder="例如 10.1002/anie.201309508">
          <button type="submit" class="btn" id="doi-btn" data-i18n="doi.button">分析</button>
        </div>
      </form>
      <p class="small muted" style="margin-top:8px"><span class="tag t3" data-i18n="legend.t3">摘要文字匹配</span> <span data-i18n="doi.disclaimer">仅分析摘要，基于文字匹配，不代表文献结论。物质名称写法不同（如缩写、商品名）时可能漏掉。</span></p>
      <p class="status" id="doi-status" aria-live="polite"></p>
      <div id="doi-result"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="tool-src" data-i18n-html="footer.short">关键风味物质引自 Dunkel 等 2014；检出数据来自 FlavorDB2（CC BY-NC-SA 3.0，本站衍生数据按同一协议共享）；文献来自 Europe PMC 和 Crossref。详见<a href="about.html">方法与来源</a>。</p>

    </div>
  </footer>

</body>
</html>
